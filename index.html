<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BY ALÉ</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

  <header class="navbar">
    <div class="nav-brand">
      <a href="index.html" class="logo-text">BY ALÉ</a>
    </div>
    <div class="nav-center" id="nav-center">
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.recipes">Recipes</a></li>
        <li><span class="nav-disabled" data-i18n="nav.blog">Blog (WIP)</span></li>
      </ul>
      <div class="search-panel" id="search-panel" aria-hidden="true">
        <label class="sr-only" for="search-input" data-i18n="buttons.searchLabel">Search recipes</label>
        <input type="search" id="search-input" placeholder="Search" data-i18n-placeholder="buttons.searchPlaceholder"
          autocomplete="off">
      </div>
    </div>
    <div class="header-actions">
      <button type="button" id="search-toggle" class="search-toggle-btn" aria-label="Open recipe search"
        data-i18n-aria-label="buttons.search">
        <span class="material-symbols-outlined">search</span>
      </button>
      <div class="settings-shell">
        <button type="button" id="theme-toggle" class="theme-toggle-btn settings-toggle-btn" aria-label="Open settings"
          data-i18n-aria-label="buttons.settings" aria-expanded="false" aria-controls="settings-popover">
          <span class="material-symbols-outlined" id="theme-icon">settings</span>
        </button>
        <div class="settings-popover" id="settings-popover" role="dialog" aria-label="Settings">
          <div class="settings-group">
            <span class="settings-label" data-i18n="settings.theme">Theme</span>
            <div class="settings-option-grid">
              <button type="button" class="settings-option-btn" data-setting="theme" data-value="light"
                data-i18n="settings.light">Light</button>
              <button type="button" class="settings-option-btn" data-setting="theme" data-value="dark"
                data-i18n="settings.dark">Dark</button>
            </div>
          </div>
          <div class="settings-group">
            <span class="settings-label" data-i18n="settings.language">Language</span>
            <div class="settings-option-grid">
              <button type="button" class="settings-option-btn" data-setting="language" data-value="en"
                data-i18n="settings.english">English</button>
              <button type="button" class="settings-option-btn" data-setting="language" data-value="de"
                data-i18n="settings.german">Deutsch</button>
              <button type="button" class="settings-option-btn" data-setting="language" data-value="ru"
                data-i18n="settings.russian">Русский</button>
            </div>
          </div>
          <div class="settings-group">
            <div class="settings-toggle-row">
              <span class="settings-label" data-i18n="settings.highContrast">High Contrast</span>
              <button type="button" class="settings-switch" id="contrast-toggle" data-setting="contrast"
                aria-pressed="false">
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <a id="hero-link" href="#" class="hero-link">
      <section class="hero-section">
        <div class="hero-content">
          <span class="hero-label" data-i18n="home.latestRecipe">Latest Recipe</span>
          <h2 class="hero-title" id="hero-title"></h2>
        </div>
        <div class="hero-image-wrapper">
          <img id="hero-image" src="" alt="" class="hero-image">
        </div>
      </section>
    </a>

    <section class="search-results-section" id="search-results-section" hidden>
      <h2 class="section-title" data-i18n="search.resultsTitle">Search Results</h2>
      <p class="search-results-summary" id="search-results-summary"></p>
      <div class="recipes-grid search-results-grid" id="search-results-grid"></div>
    </section>

    <section>
      <h2 class="section-title" data-i18n="home.weekendInspiration">Weekend Inspiration</h2>
      <div class="categories-grid" id="categories-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="social-links">
        <a class="social-link" href="https://www.instagram.com/saschakobalt" target="_blank" rel="noopener noreferrer"
          aria-label="Visit Instagram profile">
          <span class="social-icon" aria-hidden="true">
            <i class="fa-brands fa-instagram"></i>
          </span>
          <span class="social-text">Instagram • @saschakobalt</span>
        </a>
        <a class="social-link" href="faq.html" aria-label="Open FAQ page">
          <span class="social-icon" aria-hidden="true">
            <i class="fa-solid fa-circle-question"></i>
          </span>
          <span class="social-text" data-i18n="footer.faq">FAQ</span>
        </a>
        <a class="social-link" href="https://forms.gle/3FCcQHXBFqMiV2AYA" target="_blank" rel="noopener noreferrer"
          aria-label="Open feedback form">
          <span class="social-icon" aria-hidden="true">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <span class="social-text" data-i18n="footer.reportProblem">Report a problem • Google Form</span>
        </a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
